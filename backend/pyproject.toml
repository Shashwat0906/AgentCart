[project]
name = "agentcart-backend"
version = "0.1.0"
description = "AgentCart — agentic commerce API (FastAPI + LangGraph)"
requires-python = ">=3.12"
readme = "../README.md"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "RUF001", # we intentionally use the ₹ sign
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"app/seed/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning:langsmith.*",
  "ignore::DeprecationWarning:langchain_core.*",
]

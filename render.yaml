# Render Blueprint for the AgentCart API (https://render.com/docs/blueprint-spec).
# Nothing is created until you connect the repo in the Render dashboard and apply this blueprint.
services:
  - type: web
    name: agentcart-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL          # paste your Neon connection string (see docs/DEPLOYMENT.md)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS          # e.g. https://agentcart.vercel.app
        sync: false
      - key: LLM_PROVIDER
        value: mock
      - key: AUTO_SEED
        value: "true"
      - key: FORWARDED_ALLOW_IPS   # only Render's proxy can reach the service
        value: "*"
      - key: RATE_LIMIT_ENABLED
        value: "true"
